<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>BioEnable Technologies</title>
    <style>
        :root { --blue-dark:#0b3c8c; --blue-light:#2a7ade; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #f5f8fd 0%, #e8eff9 100%);
            color: #1c2b45;
        }
        .card { text-align: center; padding: 32px; }
        .logo { height: 44px; width: auto; margin-bottom: 22px; }
        .logo-fallback {
            display: none; font-size: 22px; font-weight: 700;
            color: var(--blue-dark); margin-bottom: 22px;
        }
        .spinner {
            width: 34px; height: 34px; margin: 0 auto 18px;
            border: 3px solid rgba(42,122,222,.22);
            border-top-color: var(--blue-light);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { margin: 0; font-size: 14px; color: #5a6b85; }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="logo.png" alt="BioEnable Technologies"
             onerror="this.style.display='none';document.getElementById('lf').style.display='block';">
        <div class="logo-fallback" id="lf">BioEnable Technologies</div>
        <div class="spinner"></div>
        <p>Taking you to BioEnable&hellip;</p>
    </div>

    <script>
        (function () {
            // ============================================================
            // BioEnable Tracking Redirect v5 — custom domain
            // Domain: https://campaign.bioenabletech.com/
            // ============================================================

            // ⚠️ Keep in sync with solutions.html Apps Script /exec URL
            // ⚠️ MUST be the SAME /exec as solutions.html — otherwise clicks & forms hit different apps
            var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw62GW8CXcu4-tl9HcbB39OYAqNNl2Gjut0QFPoPwutxQSHwsr4VQzcz5eeQkYnKvtivA/exec";

            // Default landing when someone opens the domain with NO redirect param
            var DEFAULT_LANDING = "https://campaign.bioenabletech.com/solutions.html";

            // ------------------------------------------------------------
            // SHORT LINKS — use these in YouTube descriptions instead of a
            // long ?redirect=... URL. Google shows its "Redirect Notice"
            // interstitial for URLs that look like open redirectors, so the
            // public-facing link should carry only a short code.
            //   https://campaign.bioenabletech.com/?c=camblocker
            // Regenerate this block from the sheet: YouTube Links > Print short-link map
            // ------------------------------------------------------------
            var SHORT_LINKS = {
                "ovse":       { landing: DEFAULT_LANDING + "#ovse",       campaign: "CMP-YT-OVSE",       content: "OVSE_DEMO_VIDEO",           source: "youtube",  medium: "video" },
                "camblocker": { landing: DEFAULT_LANDING + "#camblocker", campaign: "CMP-YT-CAMBLOCKER", content: "CAMBLOCKER_DEMO_VIDEO",     source: "youtube",  medium: "video" },
                "agent":      { landing: DEFAULT_LANDING + "#aiagent",    campaign: "CMP-YT-AGENT",      content: "AGENT_DEMO_VIDEO",          source: "youtube",  medium: "video" },
                "attendance": { landing: DEFAULT_LANDING + "#attendance", campaign: "CMP-YT-ATTENDANCE", content: "CCTV_ATTENDANCE_DEMO_VIDEO",source: "youtube",  medium: "video" },
                "ai":         { landing: DEFAULT_LANDING,                 campaign: "CMP-YT-AI",         content: "AI_SOLUTIONS_OVERVIEW",     source: "youtube",  medium: "video" },
                "software":   { landing: DEFAULT_LANDING,                 campaign: "CMP-YT-SOFTWARE",   content: "SOFTWARE_SOLUTIONS_OVERVIEW", source: "youtube", medium: "video" },
                "fb-camblocker": { landing: DEFAULT_LANDING + "#camblocker", campaign: "CMP-FB-CAMBLOCKER", content: "FB_FEED_V1", source: "facebook", medium: "paid_social" }
            };

            // github.io is deliberately NOT allowed — legacy links are rewritten to the
            // branded domain below, so a visitor can never be dropped on the raw repo URL.
            var ALLOWED_HOST_EXACT = [
                "bioenabletech.com",
                "www.bioenabletech.com",
                "campaign.bioenabletech.com"
            ];
            var ALLOWED_HOST_SUFFIX = ".bioenabletech.com";
            var FALLBACK_URL = DEFAULT_LANDING;

            var params = new URLSearchParams(window.location.search);
            var cid = params.get("cid") || "";
            var cmp = params.get("cmp") || "";
            var email = params.get("email") || "";

            var utm_source = (params.get("utm_source") || "").trim();
            var utm_medium = (params.get("utm_medium") || "").trim();
            var utm_campaign = (params.get("utm_campaign") || "").trim();
            var utm_content = (params.get("utm_content") || "").trim();
            var rawRedirect = params.get("redirect");

            // Short code expands into landing + campaign + content
            var shortCode = (params.get("c") || "").trim().toLowerCase();
            if (shortCode && SHORT_LINKS[shortCode]) {
                var preset = SHORT_LINKS[shortCode];
                if (!rawRedirect) rawRedirect = preset.landing;
                if (!utm_campaign) utm_campaign = preset.campaign;
                if (!utm_content) utm_content = preset.content;
                if (!utm_source) utm_source = preset.source || "youtube";
                if (!utm_medium) utm_medium = preset.medium || "video";
            }

            // Never treat click UUID (CMP_xxxx) as marketing campaign code
            if (!utm_campaign || utm_campaign === cmp || /^CMP_[0-9a-f-]{8,}$/i.test(utm_campaign)) {
                utm_campaign = "";
            }

            // Newsletter clicks with email+cmp but missing UTMs
            if (email && cmp && !utm_source && !utm_medium) {
                utm_source = "newsletter";
                utm_medium = "email";
            }

            // Resolve redirect target
            var targetUrl = FALLBACK_URL;
            if (rawRedirect && rawRedirect.trim() !== "") {
                try {
                    var decoded = rawRedirect;
                    for (var d = 0; d < 2; d++) {
                        try {
                            var next = decodeURIComponent(decoded);
                            if (next === decoded) break;
                            decoded = next;
                        } catch (e) { break; }
                    }
                    decoded = rewriteLegacyHost(toAbsoluteHttps(decoded));
                    if (isAllowedRedirect(decoded)) {
                        targetUrl = decoded;
                    } else {
                        console.warn("[Tracker] BLOCKED redirect host (not in allowlist):", decoded);
                        targetUrl = FALLBACK_URL;
                    }
                } catch (e) {
                    targetUrl = FALLBACK_URL;
                }
            }

            // Append UTMs onto landing page
            targetUrl = appendUtms(targetUrl, {
                utm_source: utm_source,
                utm_medium: utm_medium,
                utm_campaign: utm_campaign,
                utm_content: utm_content
            });

            // Fire Apps Script log for newsletter OR campaign UTM clicks.
            // WAIT for beacon before redirect — 80ms was cancelling the request
            // so Marketing_Events never received click rows.
            var hasCampaignUtm = !!(utm_campaign || utm_source || utm_content);
            if (email || cmp || hasCampaignUtm) {
                var qs = [
                    "event=click",
                    "cmp=" + encodeURIComponent(cmp || ("CLK_" + Date.now())),
                    "cid=" + encodeURIComponent(cid || "LINK_CLICK"),
                    "email=" + encodeURIComponent(email),
                    "utm_source=" + encodeURIComponent(utm_source),
                    "utm_medium=" + encodeURIComponent(utm_medium),
                    "utm_campaign=" + encodeURIComponent(utm_campaign),
                    "utm_content=" + encodeURIComponent(utm_content),
                    "redirect=" + encodeURIComponent(targetUrl),
                    "_t=" + Date.now()
                ].join("&");

                var beaconUrl = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?") >= 0 ? "&" : "?") + qs;
                fireAppsScriptBeacon(beaconUrl, function () {
                    window.location.replace(targetUrl);
                });
            } else {
                window.location.replace(targetUrl);
            }

            // A redirect value saved without a scheme ("campaign.bioenabletech.com/x.html")
            // would otherwise resolve as a path on this domain and produce
            // campaign.bioenabletech.com/campaign.bioenabletech.com/x.html
            function toAbsoluteHttps(url) {
                var s = (url || "").trim();
                if (!s) return s;
                if (/^\/\//.test(s)) return "https:" + s;
                if (/^https?:\/\//i.test(s)) return s.replace(/^http:\/\//i, "https://");
                if (/^[a-z0-9.-]+\.[a-z]{2,}(\/|$|\?|#)/i.test(s)) return "https://" + s;
                return s;
            }

            // Links already pasted in YouTube descriptions still point at the raw
            // GitHub Pages URL. Map them onto the branded domain instead of blocking.
            function rewriteLegacyHost(url) {
                try {
                    var u = new URL(url);
                    if (u.hostname.toLowerCase() !== "shubham31052000.github.io") return url;
                    var page = u.pathname.split("/").pop() || "solutions.html";
                    return "https://campaign.bioenabletech.com/" + page + u.search + u.hash;
                } catch (e) {
                    return url;
                }
            }

            function isAllowedRedirect(url) {
                try {
                    // No base URL — a relative value must fail here, never be
                    // resolved against our own origin.
                    var u = new URL(url);
                    if (u.protocol !== "https:") return false;
                    var host = u.hostname.toLowerCase();
                    if (ALLOWED_HOST_EXACT.indexOf(host) !== -1) return true;
                    if (host.length > ALLOWED_HOST_SUFFIX.length &&
                        host.slice(-ALLOWED_HOST_SUFFIX.length) === ALLOWED_HOST_SUFFIX) {
                        return true;
                    }
                    return false;
                } catch (e) {
                    return false;
                }
            }

            function appendUtms(url, utms) {
                try {
                    var u = new URL(url);
                    Object.keys(utms).forEach(function (k) {
                        var v = utms[k];
                        if (v && !u.searchParams.get(k)) {
                            u.searchParams.set(k, v);
                        }
                    });
                    return u.toString();
                } catch (e) {
                    var extra = [];
                    Object.keys(utms).forEach(function (k) {
                        if (utms[k] && url.indexOf(k + "=") === -1) {
                            extra.push(encodeURIComponent(k) + "=" + encodeURIComponent(utms[k]));
                        }
                    });
                    if (!extra.length) return url;
                    return url + (url.indexOf("?") >= 0 ? "&" : "?") + extra.join("&");
                }
            }

            // ONE beacon — wait for load/error (or max 1.5s) then redirect
            function fireAppsScriptBeacon(url, onDone) {
                var done = false;
                function finish() {
                    if (done) return;
                    done = true;
                    if (typeof onDone === "function") onDone();
                }

                try {
                    var img = new Image();
                    img.onload = finish;
                    img.onerror = finish;
                    img.referrerPolicy = "no-referrer-when-downgrade";
                    img.src = url;
                } catch (e1) {
                    finish();
                    return;
                }

                // Apps Script is slow — give it time before navigating away
                setTimeout(finish, 1500);
            }
        })();
    </script>
</body>
</html>
