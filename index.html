<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; color: #333; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #1565C0; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Redirecting to BioEnable Technologies...</p>

    <script>
        (function() {
            // 1. Read URL Parameters
            const params   = new URLSearchParams(window.location.search);
            const cid      = params.get('cid') || '';
            const cmp      = params.get('cmp') || '';
            const email    = params.get('email') || '';
            const redirect = params.get('redirect') || 'https://www.bioenabletech.com';

            // 2. Your Google Apps Script Web App URL (for logging click & Zoho CRM push)
            const appsScriptUrl = "https://script.google.com/macros/s/AKfycbzXdTdZIpRBPMm1NsPeIpF6J9N9zAykwENMEEmfvSfhdQteRUsFxujX43BIt3gHZ1OTzg/exec"
                + "?cmp=" + encodeURIComponent(cmp)
                + "&cid=" + encodeURIComponent(cid)
                + "&email=" + encodeURIComponent(email);

            // 3. Send click log in background, then redirect
            fetch(appsScriptUrl, { mode: 'no-cors' })
                .then(function() {
                    window.location.href = redirect;
                })
                .catch(function() {
                    window.location.href = redirect;
                });

            // Fallback redirect after 800ms if fetch hangs
            setTimeout(function() {
                window.location.href = redirect;
            }, 800);
        })();
    </script>
</body>
</html>
