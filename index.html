<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 60px; color: #444; }
    </style>
</head>
<body>
    <p>Redirecting to BioEnable Technologies...</p>

    <script>
        (function() {
            // 1. Get query string parameters
            const params       = new URLSearchParams(window.location.search);
            const cid          = params.get('cid') || '';
            const cmp          = params.get('cmp') || '';
            const email        = params.get('email') || '';
            const utm_source   = params.get('utm_source') || 'newsletter';
            const utm_medium   = params.get('utm_medium') || 'email';
            const utm_campaign = params.get('utm_campaign') || cmp;
            const utm_content  = params.get('utm_content') || '';
            const rawRedirect  = params.get('redirect');

            // 2. Resolve target landing page (Decode URL)
            let targetUrl = 'https://www.bioenabletech.com'; // fallback only if blank
            if (rawRedirect && rawRedirect.trim() !== '') {
                try {
                    targetUrl = decodeURIComponent(rawRedirect);
                } catch(e) {
                    targetUrl = rawRedirect;
                }
            }

            // 3. Build Google Apps Script Logging Webhook URL
            const appsScriptUrl = "https://script.google.com/macros/s/AKfycbxvZo76wW_DNAQhmtULW332LQYgQvhR7cubvOSBiq3GLEHSWjBQxnpq6x-Q8JkOMOhtkw/exec"
                + "?cmp=" + encodeURIComponent(cmp)
                + "&cid=" + encodeURIComponent(cid)
                + "&email=" + encodeURIComponent(email)
                + "&utm_source=" + encodeURIComponent(utm_source)
                + "&utm_medium=" + encodeURIComponent(utm_medium)
                + "&utm_campaign=" + encodeURIComponent(utm_campaign)
                + "&utm_content=" + encodeURIComponent(utm_content);

            // 4. FIRE & FORGET (Send log packet in background - non-blocking)
            try {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon(appsScriptUrl);
                } else {
                    fetch(appsScriptUrl, { mode: 'no-cors', cache: 'no-cache' });
                }
            } catch(e) {}

            // 5. INSTANT REDIRECT (50ms - imperceptible to user)
            setTimeout(function() {
                window.location.replace(targetUrl);
            }, 50);
        })();
    </script>
</body>
</html>
