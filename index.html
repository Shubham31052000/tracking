<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer-when-downgrade">
    <title>BioEnable Technologies</title>
    <style>
        :root { --blue-dark:#0b3c8c; --blue-light:#2a7ade; }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #f5f8fd 0%, #e8eff9 100%);
            color: #1c2b45;
        }
        .card { text-align: center; padding: 32px; }
        .logo { height: 44px; width: auto; margin-bottom: 22px; }
        .logo-fallback {
            display: none; font-size: 22px; font-weight: 700;
            color: var(--blue-dark); margin-bottom: 22px;
        }
        .spinner {
            width: 34px; height: 34px; margin: 0 auto 18px;
            border: 3px solid rgba(42,122,222,.22);
            border-top-color: var(--blue-light);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { margin: 0; font-size: 14px; color: #5a6b85; }
        @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="logo.png" alt="BioEnable Technologies"
             onerror="this.style.display='none';document.getElementById('lf').style.display='block';">
        <div class="logo-fallback" id="lf">BioEnable Technologies</div>
        <div class="spinner"></div>
        <p>Taking you to BioEnable&hellip;</p>
    </div>

    <script>
        (function () {
            // ============================================================
            // BioEnable Tracking Redirect v6
            // Short codes resolve from:
            //   1) baked SHORT_LINKS
            //   2) short-links.json (same folder — from Marketing_Links)
            //   3) smart infer (software08 → youtube — NEVER "direct")
            // ============================================================

            var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw62GW8CXcu4-tl9HcbB39OYAqNNl2Gjut0QFPoPwutxQSHwsr4VQzcz5eeQkYnKvtivA/exec";
            var DEFAULT_LANDING = "https://campaign.bioenabletech.com/solutions.html";
            var FORM_LANDING = DEFAULT_LANDING + "#enquire";

            // Fallback seeds (full map loads from short-links.json)
            var SHORT_LINKS = {
                "ovse": { landing: FORM_LANDING, campaign: "CMP-YT-OVSE", content: "OVSE_DEMO_VIDEO", source: "youtube", medium: "video" },
                "camblocker": { landing: FORM_LANDING, campaign: "CMP-YT-CAMBLOCKER", content: "CAMBLOCKER_DEMO_VIDEO", source: "youtube", medium: "video" },
                "agent": { landing: FORM_LANDING, campaign: "CMP-YT-AGENT", content: "AGENT_DEMO_VIDEO", source: "youtube", medium: "video" },
                "attendance": { landing: FORM_LANDING, campaign: "CMP-YT-ATTENDANCE", content: "CCTV_ATTENDANCE_DEMO_VIDEO", source: "youtube", medium: "video" },
                "ai": { landing: FORM_LANDING, campaign: "CMP-YT-AI", content: "AI_SOLUTIONS_OVERVIEW", source: "youtube", medium: "video" },
                "software": { landing: FORM_LANDING, campaign: "CMP-YT-SOFTWARE", content: "SOFTWARE_SOLUTIONS_OVERVIEW", source: "youtube", medium: "video" },
                "fb-camblocker": { landing: FORM_LANDING, campaign: "CMP-FB-CAMBLOCKER", content: "FB_FEED_V1", source: "facebook", medium: "paid_social" },
                "cmpfbcamblocker": { landing: FORM_LANDING, campaign: "CMP-FB-CAMBLOCKER", content: "FB_FEED_V1", source: "facebook", medium: "paid_social" }
            };

            var ALLOWED_HOST_EXACT = [
                "bioenabletech.com",
                "www.bioenabletech.com",
                "campaign.bioenabletech.com"
            ];
            var ALLOWED_HOST_SUFFIX = ".bioenabletech.com";
            var FALLBACK_URL = DEFAULT_LANDING;

            var params = new URLSearchParams(window.location.search);
            var cid = params.get("cid") || "";
            var cmp = params.get("cmp") || "";
            var email = params.get("email") || "";
            var utm_source = (params.get("utm_source") || "").trim();
            var utm_medium = (params.get("utm_medium") || "").trim();
            var utm_campaign = (params.get("utm_campaign") || "").trim();
            var utm_content = (params.get("utm_content") || "").trim();
            var rawRedirect = params.get("redirect");
            var shortCode = (params.get("c") || "").trim().toLowerCase();

            // Load live map from Apps Script (Marketing_Links) — no manual JSON upload.
            // Fallback: short-links.json on GitHub, then infer (never "direct").
            if (shortCode) {
                loadLiveShortMap(function () {
                    applyShortCodeAndGo();
                });
            } else {
                applyShortCodeAndGo();
            }

            function mergeMap(remote) {
                if (!remote || typeof remote !== "object") return;
                Object.keys(remote).forEach(function (k) {
                    SHORT_LINKS[String(k).toLowerCase()] = remote[k];
                });
            }

            function loadLiveShortMap(done) {
                var finished = false;
                function finish() {
                    if (finished) return;
                    finished = true;
                    done();
                }
                setTimeout(finish, 3500);

                // 1) Apps Script JSONP — always fresh from sheet (after Deploy)
                try {
                    var cbName = "_beMap" + String(Date.now());
                    window[cbName] = function (data) {
                        try {
                            mergeMap(data);
                            console.log("[Tracker] Live short map from Apps Script (" + Object.keys(data || {}).length + ")");
                        } catch (e1) {}
                        try { delete window[cbName]; } catch (e2) {}
                        try {
                            var s = document.getElementById(cbName);
                            if (s && s.parentNode) s.parentNode.removeChild(s);
                        } catch (e3) {}
                        finish();
                    };
                    var script = document.createElement("script");
                    script.id = cbName;
                    script.async = true;
                    script.src = APPS_SCRIPT_URL +
                        (APPS_SCRIPT_URL.indexOf("?") >= 0 ? "&" : "?") +
                        "action=short_map&callback=" + encodeURIComponent(cbName) +
                        "&_t=" + Date.now();
                    script.onerror = function () {
                        loadShortLinksJsonFile(finish);
                    };
                    document.head.appendChild(script);
                } catch (e) {
                    loadShortLinksJsonFile(finish);
                }
            }

            function loadShortLinksJsonFile(done) {
                try {
                    var xhr = new XMLHttpRequest();
                    xhr.open("GET", "short-links.json?_=" + Date.now(), true);
                    xhr.timeout = 2000;
                    xhr.onload = function () {
                        if (xhr.status >= 200 && xhr.status < 300) {
                            try {
                                mergeMap(JSON.parse(xhr.responseText));
                                console.log("[Tracker] Fallback short-links.json loaded");
                            } catch (e) {}
                        }
                        done();
                    };
                    xhr.onerror = function () { done(); };
                    xhr.ontimeout = function () { done(); };
                    xhr.send();
                } catch (e) {
                    done();
                }
            }

            /**
             * Infer from Short_Code patterns when JSON/map missing.
             * software08 → youtube / CMP-YT_SOFTWARE_08  (matches Marketing_Links)
             * NEVER returns source=direct (that broke Zoho Lead Source).
             */
            function inferPresetFromCode(code) {
                var c = (code || "").toLowerCase();
                if (!c) return null;

                if (/^fb[-_]?/.test(c) || c.indexOf("facebook") !== -1 || c.indexOf("meta") !== -1) {
                    return {
                        landing: FORM_LANDING,
                        campaign: "CMP-FB-" + c.replace(/^fb[-_]?/, "").replace(/[^a-z0-9]+/gi, "_").toUpperCase(),
                        content: c.replace(/[^a-z0-9]+/gi, "_").toUpperCase(),
                        source: "facebook",
                        medium: "paid_social"
                    };
                }
                if (/^li[-_]?/.test(c) || c.indexOf("linkedin") !== -1) {
                    return {
                        landing: FORM_LANDING,
                        campaign: "CMP-LI-" + c.replace(/^li[-_]?/, "").replace(/[^a-z0-9]+/gi, "_").toUpperCase(),
                        content: c.replace(/[^a-z0-9]+/gi, "_").toUpperCase(),
                        source: "linkedin",
                        medium: "paid_social"
                    };
                }
                if (/^ga[-_]?/.test(c) || c.indexOf("google") !== -1) {
                    return {
                        landing: FORM_LANDING,
                        campaign: "CMP-GA-" + c.replace(/^ga[-_]?/, "").replace(/[^a-z0-9]+/gi, "_").toUpperCase(),
                        content: c.replace(/[^a-z0-9]+/gi, "_").toUpperCase(),
                        source: "google",
                        medium: "cpc"
                    };
                }

                // software08 / ovse01 / camblocker2 — sheet style CMP-YT_SOFTWARE_08
                var m = c.match(/^(software|ovse|camblocker|agent|attendance|ai)(\d+)$/i);
                if (m) {
                    var base = m[1].toLowerCase();
                    var num = m[2];
                    var baseUp = base.toUpperCase();
                    var contentMap = {
                        software: "SOFTWARE_SOLUTIONS_OVERVIEW_",
                        ovse: "OVSE_DEMO_VIDEO_",
                        camblocker: "CAMBLOCKER_DEMO_VIDEO_",
                        agent: "AGENT_DEMO_VIDEO_",
                        attendance: "CCTV_ATTENDANCE_DEMO_VIDEO_",
                        ai: "AI_SOLUTIONS_OVERVIEW_"
                    };
                    return {
                        landing: FORM_LANDING,
                        campaign: "CMP-YT_" + baseUp + "_" + num,
                        content: (contentMap[base] || (baseUp + "_")) + num,
                        source: "youtube",
                        medium: "video"
                    };
                }

                // Generic YT-style short code
                return {
                    landing: FORM_LANDING,
                    campaign: "CMP-YT-" + c.replace(/[^a-z0-9]+/gi, "-").toUpperCase(),
                    content: c.replace(/[^a-z0-9]+/gi, "_").toUpperCase(),
                    source: "youtube",
                    medium: "video"
                };
            }

            function applyShortCodeAndGo() {
                if (shortCode) {
                    var preset = SHORT_LINKS[shortCode] || inferPresetFromCode(shortCode);
                    if (preset) {
                        if (!SHORT_LINKS[shortCode]) {
                            console.warn("[Tracker] Used inferred map for", shortCode, preset);
                        }
                        if (!rawRedirect) rawRedirect = preset.landing || FORM_LANDING;
                        // ALWAYS use Marketing_Links when ?c= is present.
                        // Meta ads often append utm_source=an|fb + numeric campaign/ad IDs
                        // even if Tracking → URL parameters is empty — those must not win.
                        utm_campaign = preset.campaign || "";
                        utm_content = preset.content || "";
                        utm_source = preset.source || "youtube";
                        utm_medium = preset.medium || "video";
                        console.log("[Tracker] Short code forced UTMs:", shortCode, utm_source, utm_campaign);
                    }
                }

                // Never keep bogus "direct" from old unknown-code redirects if we have a short code
                if (shortCode && (utm_source === "direct" || utm_medium === "short_link")) {
                    var fix = SHORT_LINKS[shortCode] || inferPresetFromCode(shortCode);
                    if (fix) {
                        utm_source = fix.source || "youtube";
                        utm_medium = fix.medium || "video";
                        utm_campaign = fix.campaign || utm_campaign;
                        utm_content = fix.content || utm_content;
                    }
                }

                if (!utm_campaign || utm_campaign === cmp || /^CMP_[0-9a-f-]{8,}$/i.test(utm_campaign)) {
                    utm_campaign = "";
                }

                if (email && cmp && !utm_source && !utm_medium) {
                    utm_source = "newsletter";
                    utm_medium = "email";
                }

                var targetUrl = FALLBACK_URL;
                if (rawRedirect && rawRedirect.trim() !== "") {
                    try {
                        var decoded = rawRedirect;
                        for (var d = 0; d < 2; d++) {
                            try {
                                var next = decodeURIComponent(decoded);
                                if (next === decoded) break;
                                decoded = next;
                            } catch (e) { break; }
                        }
                        decoded = rewriteLegacyHost(toAbsoluteHttps(decoded));
                        if (isAllowedRedirect(decoded)) targetUrl = decoded;
                        else targetUrl = FALLBACK_URL;
                    } catch (e) {
                        targetUrl = FALLBACK_URL;
                    }
                }

                targetUrl = appendUtms(targetUrl, {
                    utm_source: utm_source,
                    utm_medium: utm_medium,
                    utm_campaign: utm_campaign,
                    utm_content: utm_content
                }, !!shortCode);
                targetUrl = forceEnquireHash(targetUrl);

                var hasCampaignUtm = !!(utm_campaign || utm_source || utm_content);
                var shouldLogClick = !!(email || cmp || hasCampaignUtm || shortCode);
                if (shouldLogClick) {
                    var qs = [
                        "event=click",
                        "cmp=" + encodeURIComponent(cmp || ("CLK_" + Date.now())),
                        "cid=" + encodeURIComponent(cid || "LINK_CLICK"),
                        "email=" + encodeURIComponent(email),
                        "utm_source=" + encodeURIComponent(utm_source),
                        "utm_medium=" + encodeURIComponent(utm_medium),
                        "utm_campaign=" + encodeURIComponent(utm_campaign),
                        "utm_content=" + encodeURIComponent(utm_content),
                        "redirect=" + encodeURIComponent(targetUrl),
                        "_t=" + Date.now()
                    ].join("&");
                    var beaconUrl = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?") >= 0 ? "&" : "?") + qs;
                    console.log("[Tracker] Click beacon →", shortCode || "(long)", utm_source, utm_campaign);
                    fireAppsScriptBeacon(beaconUrl, function () {
                        window.location.replace(targetUrl);
                    });
                } else {
                    window.location.replace(targetUrl);
                }
            }

            function toAbsoluteHttps(url) {
                var s = (url || "").trim();
                if (!s) return s;
                if (/^\/\//.test(s)) return "https:" + s;
                if (/^https?:\/\//i.test(s)) return s.replace(/^http:\/\//i, "https://");
                if (/^[a-z0-9.-]+\.[a-z]{2,}(\/|$|\?|#)/i.test(s)) return "https://" + s;
                return s;
            }

            function rewriteLegacyHost(url) {
                try {
                    var u = new URL(url);
                    if (u.hostname.toLowerCase() !== "shubham31052000.github.io") return url;
                    var page = u.pathname.split("/").pop() || "solutions.html";
                    return "https://campaign.bioenabletech.com/" + page + u.search + u.hash;
                } catch (e) {
                    return url;
                }
            }

            function isAllowedRedirect(url) {
                try {
                    var u = new URL(url);
                    if (u.protocol !== "https:") return false;
                    var host = u.hostname.toLowerCase();
                    if (ALLOWED_HOST_EXACT.indexOf(host) !== -1) return true;
                    if (host.length > ALLOWED_HOST_SUFFIX.length &&
                        host.slice(-ALLOWED_HOST_SUFFIX.length) === ALLOWED_HOST_SUFFIX) {
                        return true;
                    }
                    return false;
                } catch (e) {
                    return false;
                }
            }

            function appendUtms(url, utms, forceOverwrite) {
                try {
                    var u = new URL(url);
                    Object.keys(utms).forEach(function (k) {
                        var v = utms[k];
                        if (!v) return;
                        // forceOverwrite: short-link (?c=) must replace Meta an/fb / numeric IDs
                        if (forceOverwrite || !u.searchParams.get(k)) u.searchParams.set(k, v);
                    });
                    return u.toString();
                } catch (e) {
                    var extra = [];
                    Object.keys(utms).forEach(function (k) {
                        if (!utms[k]) return;
                        if (forceOverwrite) {
                            // Strip existing key then re-add (best-effort fallback)
                            url = url.replace(new RegExp("([?&])" + k + "=[^&]*", "i"), "$1");
                            url = url.replace(/\?&/, "?").replace(/&&+/g, "&").replace(/[?&]$/, "");
                        }
                        if (forceOverwrite || url.indexOf(k + "=") === -1) {
                            extra.push(encodeURIComponent(k) + "=" + encodeURIComponent(utms[k]));
                        }
                    });
                    if (!extra.length) return url;
                    return url + (url.indexOf("?") >= 0 ? "&" : "?") + extra.join("&");
                }
            }

            function forceEnquireHash(url) {
                try {
                    var u = new URL(url);
                    if (u.pathname.indexOf("solutions") === -1 &&
                        u.hostname.indexOf("campaign.bioenabletech.com") === -1) {
                        return url;
                    }
                    var h = (u.hash || "").toLowerCase();
                    var product = { "#camblocker":1, "#ovse":1, "#aiagent":1, "#attendance":1, "#solutions":1, "":1 };
                    if (product[h] || !h) u.hash = "enquire";
                    return u.toString();
                } catch (e) {
                    return (url || "").replace(/#(camblocker|ovse|aiagent|attendance|solutions)\b/i, "#enquire");
                }
            }

            function fireAppsScriptBeacon(url, onDone) {
                var done = false;
                function finish() {
                    if (done) return;
                    done = true;
                    if (typeof onDone === "function") onDone();
                }
                try {
                    var img = new Image();
                    img.onload = finish;
                    img.onerror = finish;
                    img.referrerPolicy = "no-referrer-when-downgrade";
                    img.src = url;
                } catch (e1) {
                    finish();
                    return;
                }
                setTimeout(finish, 500);
            }
        })();
    </script>
</body>
</html>
